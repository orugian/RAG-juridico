[project]
name = "production-api-aadvogados"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langsmith>=0.12.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
